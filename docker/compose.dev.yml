networks:
  pda-net-dev:
    driver: bridge


services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    command: -p 5433
    environment:
      POSTGRES_USER: pdanetwork
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "5433:5433"
    networks:
      - pda-net-dev

  backend:
    image: ghcr.io/artux-net/pdanetwork:${IMAGE_TAG}
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 768mb
        reservations:
          memory: 512mb
    networks:
      - pda-net-dev
    environment:
      SPRING_PROFILES_ACTIVE: default, dev
      METRICS_NAMESPACE: dev
      SERVER_HOST: api-test.artux.net
      SERVER_PROTOCOL: https
      SERVER_WEBSOCKET_PROTOCOL: wss
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5433/pdanetwork
      SPRING_DATASOURCE_USERNAME: pdanetwork
      SPRING_DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}
      S3_ID: ${S3_ACCESS_ID}
      S3_KEY: ${S3_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdanetwork_dev.rule=Host(`api-test.artux.net`) && PathPrefix(`/pdanetwork`)"
      - "traefik.http.routers.pdanetwork_dev.entrypoints=websecure"
      - "traefik.http.routers.pdanetwork_dev.tls=true"
      - "traefik.http.routers.pdanetwork_dev.tls.certresolver=myresolver"
      - "traefik.http.services.pdanetwork_dev.loadbalancer.server.port=8080"
      - "traefik.http.services.pdanetwork_dev.loadbalancer.healthcheck.path=/actuator/health"
      - "traefik.http.services.pdanetwork_dev.loadbalancer.healthcheck.port=8081"
      - "traefik.http.services.pdanetwork_dev.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.pdanetwork_dev.loadbalancer.healthcheck.timeout=3s"
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8081"
      - "prometheus.io/path=/actuator/prometheus"
