name: 🧪 E2E Smoke Test

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  e2e:
    name: "E2E (${{ matrix.env.name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - name: dev
            base_url: https://dev.artux.net/pdanetwork
          - name: prod
            base_url: https://app.artux.net/pdanetwork
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "20"
          cache: "gradle"

      - name: Run user flow e2e test
        env:
          E2E_BASE_URL: ${{ matrix.env.base_url }}
        run: ./gradlew e2eTest --no-daemon

      - name: Upload e2e test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.env.name }}
          path: pdanet/build/reports/tests/e2eTest/
