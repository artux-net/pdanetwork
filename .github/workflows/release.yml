name: 🚀Release to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate-tag:
    name: Validate tag format
    runs-on: ubuntu-latest
    outputs:
      semantic_version: ${{ steps.validate.outputs.semantic_version }}
    steps:
      - name: Ensure ref is a tag
        run: |
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "::error::This workflow only releases from a tag, but a ${{ github.ref_type }} was selected (${{ github.ref_name }})."
            echo "In 'Run workflow', use the 'Use workflow from' selector to pick an existing tag."
            exit 1
          fi

      - name: Validate tag format
        id: validate
        run: |
          TAG_NAME="${{ github.ref_name }}"

          echo "Tag to validate: $TAG_NAME"

          # Validate semantic version format (v1.2.3)
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag '$TAG_NAME' does not match semantic version format (v1.2.3)"
            exit 1
          fi

          echo "semantic_version=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Valid semantic version: $TAG_NAME"

  backup-db:
    name: Backup DB before production release
    needs: validate-tag
    uses: ./.github/workflows/backup.yml
    secrets: inherit

  deploy-production:
    needs: 
      - validate-tag
      - backup-db
    name: Deploy to Production (auto-detecting prod profile from tag)
    uses: ./.github/workflows/deploy.yml
    secrets: inherit